# Nebari Infrastructure Core - local (kind) starter config
#
# The local provider runs everything in a kind cluster on your machine, so it
# needs no cloud credentials. Only project_name is a placeholder; edit it, then
# `nic validate` will pass. (grep -n CHANGEME config.yaml)

project_name: CHANGEME
domain: nebari.local

certificate:
  type: selfsigned

cluster:
  local:
    node_selectors:
      general:
        kubernetes.io/os: linux
      user:
        kubernetes.io/os: linux
      worker:
        kubernetes.io/os: linux

# git_repository omitted on purpose: NIC auto-creates ~/.nic/gitops/<project_name>
# and mounts it into the kind cluster (zero-config for local dev).
