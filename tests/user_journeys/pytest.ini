[pytest]
markers =
    ui: journey drives a browser via Playwright
    slow: journey takes over 60 seconds
    tls: journey's SUBJECT is PUBLIC TRUST specifically -- that an
        ordinary client with no cluster-supplied anchor accepts the
        gateway certificate. Skipped where public trust is not on offer:
        a self-signed leaf, or a privately issued chain such as Let's
        Encrypt staging (see nebari_journeys.trust.classify_anchor).
        NOT for a journey that merely travels over TLS, and NOT for
        certificate validity in general -- validity, expiry, hostname and
        chain completeness are checked on EVERY cluster shape by the
        unmarked journey in journeys/test_tls.py.
    requires_trusted_ca: journey depends on a third party (not the test
        runner) trusting the gateway certificate, which is impossible on a
        cluster whose gateway anchor is a self-signed leaf; skipped there
        (see nebari_journeys.trust.is_self_signed_leaf)
addopts = --strict-markers
