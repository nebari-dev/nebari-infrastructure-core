project_name: azure-ci
domain: azure-ci.nebari.dev

certificate:
  type: letsencrypt
  acme:
    email: ci@nebari.dev
    server: https://acme-staging-v02.api.letsencrypt.org/directory

dns:
  cloudflare:
    zone_name: nebari.dev

repository:
  existing:
    url: "https://github.com/nebari-dev/nic-ci-gitops.git"
    branch: azure
    path: "clusters/azure-ci"
    auth:
      token:
        env: GIT_TOKEN

cluster:
  azure:
    region: eastus

    kubernetes_version: "1.36"
    sku_tier: Free
    private_cluster_enabled: false

    network:
      vnet_cidr_block: "10.0.0.0/16"
      node_subnet_cidr_block: "10.0.0.0/22"
      pod_cidr: "10.244.0.0/16"
      service_cidr: "10.0.16.0/22"
      dns_service_ip: "10.0.16.10"

    node_groups:
      general:
        instance: Standard_D4_v3
        min_nodes: 1
        max_nodes: 3
        mode: System

      worker:
        instance: Standard_D4_v3
        min_nodes: 1
        max_nodes: 3

    tags:
      Environment: development
      Project: nebari
