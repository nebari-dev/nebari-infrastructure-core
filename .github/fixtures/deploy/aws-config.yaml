project_name: aws-ci
domain: aws-ci.nebari.dev

certificate:
  type: letsencrypt
  acme:
    email: ci@nebari.dev
    server: https://acme-staging-v02.api.letsencrypt.org/directory

dns:
  cloudflare:
    zone_name: nebari.dev

repository:
  existing:
    url: "https://github.com/nebari-dev/nic-ci-gitops.git"
    branch: aws
    path: "clusters/aws-ci"
    auth:
      token:
        env: GIT_TOKEN

cluster:
  aws:
    region: us-west-2
    kubernetes_version: "1.36"
    availability_zones:
      - us-west-2a
      - us-west-2b
    vpc_cidr_block: "10.10.0.0/16"
    endpoint_private_access: true
    endpoint_public_access: true

    node_groups:
      general:
        instance: m5.xlarge
        min_nodes: 1
        max_nodes: 3

      worker:
        instance: m5.xlarge
        min_nodes: 1
        max_nodes: 3

    # Default MULTI_AZ_1, so CI covers the route-table path users get. Skip the
    # final backup and delete child volumes so teardown leaves nothing billed.
    fsx_openzfs:
      enabled: true
      skip_final_backup: true
      delete_child_volumes_on_destroy: true

    tags:
      Environment: ci
      Project: nebari
