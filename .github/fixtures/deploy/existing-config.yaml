project_name: existing-ci
domain: nebari.local

certificate:
  type: selfsigned

repository:
  existing:
    url: "https://github.com/nebari-dev/nic-ci-gitops.git"
    branch: existing
    path: "clusters/existing-ci"
    auth:
      token:
        env: GIT_TOKEN

cluster:
  existing:
    context: k3d-existing-ci
    storage_class: local-path
