name: Starters

on:
  pull_request:
    paths:
      - "starters/**"
      - "scripts/gen-starters.sh"
      - "examples/local-config.yaml"
      - "examples/aws-config.yaml"
      - ".github/workflows/starters.yml"
  push:
    branches: [ main ]
    paths:
      - "starters/**"
      - "scripts/gen-starters.sh"
      - "examples/local-config.yaml"
      - "examples/aws-config.yaml"
      - ".github/workflows/starters.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Starters publish under the existing nebari project, in a starters/ subdir,
  # mirroring how the charts live at quay.io/nebari/charts.
  QUAY_NAMESPACE: nebari
  STARTER_REPO_PREFIX: starters

jobs:
  validate-starters:
    name: Validate starters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nic and put it on PATH
        run: |
          make build
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Generate starters
        run: ./scripts/gen-starters.sh dist/starters

      - name: Starters carry placeholders and validate once filled
        run: |
          set -euo pipefail
          for provider in local aws; do
            config="dist/starters/${provider}/config.yaml"

            # 1. The generator must have substituted placeholders.
            echo "== ${provider}: starter carries placeholders =="
            grep -q CHANGEME "$config" || {
              echo "FAIL: ${provider} starter has no CHANGEME placeholder"; exit 1; }

            # 2. A filled copy must validate. The fill script is emitted by
            #    the generator from the same field list it used to insert the
            #    placeholders, so CI never keeps its own copy to drift.
            echo "== ${provider}: filled starter validates =="
            filled="$(mktemp)"
            sed -f "dist/starters/${provider}/.fill-for-ci.sed" "$config" > "$filled"
            if grep -q CHANGEME "$filled"; then
              echo "FAIL: ${provider} still has placeholders after filling"
              grep -n CHANGEME "$filled"
              exit 1
            fi
            nic validate -f "$filled"

            # 3. The unedited starter must not be deployable. The CHANGEME
            #    rejection lands with #561; until it is on main nic accepts
            #    placeholder configs. Since step 2 just proved the only
            #    difference is the placeholders, a passing validate here means
            #    the feature is absent rather than that the starter is wrong,
            #    so report it instead of failing. This starts enforcing on its
            #    own the moment #561 merges.
            echo "== ${provider}: unedited starter is not deployable =="
            if err="$(nic validate -f "$config" 2>&1)"; then
              echo "PENDING: nic on this ref does not reject placeholders yet (#561)."
              echo "         Placeholder presence and the filled config were still checked."
            elif echo "$err" | grep -q CHANGEME; then
              echo "$err"
              echo "OK: unedited ${provider} starter rejected, error names CHANGEME"
            else
              echo "FAIL: ${provider} unedited starter failed for an unexpected reason"
              echo "$err"
              exit 1
            fi
          done

  publish-starters:
    name: Publish starters to quay.io
    needs: validate-starters
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Skip when no quay credentials are configured
        id: creds
        run: |
          if [ -z "${QUAY_TOKEN:-}" ]; then
            echo "no quay credentials, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pixi and nebi
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl -fsSL https://pixi.sh/install.sh -o /tmp/pixi-install.sh
          sh /tmp/pixi-install.sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          # Asset-layer bundling (config.yaml and README travelling with the
          # workspace) needs nebi >= 0.10; older versions silently ship only
          # pixi.toml and pixi.lock.
          pixi global install "nebi>=0.10"

      - name: Generate starters
        if: steps.creds.outputs.skip == 'false'
        run: ./scripts/gen-starters.sh dist/starters

      - name: Configure quay registry
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          printf '%s' "$QUAY_TOKEN" | nebi registry add --local \
            --name quay \
            --url quay.io \
            --namespace "$QUAY_NAMESPACE" \
            --username "$QUAY_USERNAME" \
            --password-stdin

      - name: Lock and publish each starter
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          for provider in local aws; do
            pushd "dist/starters/${provider}" > /dev/null
            # Resolve the toolchain now so the published bundle carries a lock.
            pixi lock
            nebi init
            nebi publish --local \
              --registry quay \
              --repo "${STARTER_REPO_PREFIX}/starter-${provider}" \
              --tag "v${version}"
            popd > /dev/null
          done

      - name: Imported starters must still be rejected unedited
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          for provider in local aws; do
            dest="/tmp/imported-${provider}"
            nebi import "quay.io/${QUAY_NAMESPACE}/${STARTER_REPO_PREFIX}/starter-${provider}:v${version}" -o "$dest"
            test -f "$dest/config.yaml"
            grep -q CHANGEME "$dest/config.yaml"
            echo "OK: ${provider} round-tripped with its placeholders intact"
          done
