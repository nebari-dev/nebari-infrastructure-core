name: Starters

on:
  pull_request:
    paths:
      - "starters/**"
      - "scripts/gen-starters.sh"
      - "examples/local-config.yaml"
      - "examples/aws-config.yaml"
      - ".github/workflows/starters.yml"
  push:
    branches: [ main ]
    paths:
      - "starters/**"
      - "scripts/gen-starters.sh"
      - "examples/local-config.yaml"
      - "examples/aws-config.yaml"
      - ".github/workflows/starters.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Starters publish under the existing nebari project, in a starters/ subdir,
  # mirroring how the charts live at quay.io/nebari/charts.
  QUAY_NAMESPACE: nebari
  STARTER_REPO_PREFIX: starters

jobs:
  # NOTE: the "unedited config is rejected" assertion below only holds once the
  # CHANGEME check (#561) is merged to main. Until then nic-from-main accepts
  # placeholder configs and this job goes red. Expected while that PR is open.
  validate-starters:
    name: Validate starters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nic and put it on PATH
        run: |
          make build
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Generate starters
        run: ./scripts/gen-starters.sh dist/starters

      - name: Unedited starters must be rejected, filled ones must pass
        run: |
          set -euo pipefail
          for provider in local aws; do
            config="dist/starters/${provider}/config.yaml"
            echo "== ${provider}: asserting the unedited config is rejected =="
            if err="$(nic validate -f "$config" 2>&1)"; then
              echo "FAIL: nic validate accepted the unedited ${provider} starter"
              echo "$err"
              exit 1
            fi
            echo "$err"
            echo "$err" | grep -q CHANGEME || {
              echo "FAIL: ${provider} validation error did not mention CHANGEME"; exit 1; }

            echo "== ${provider}: asserting a filled config passes =="
            filled="$(mktemp)"
            sed -e "s|project_name: CHANGEME|project_name: nebari-${provider}-ci|" \
                -e "s|^domain: CHANGEME|domain: nebari.example.com|" \
                -e "s|^    email: CHANGEME|    email: admin@example.com|" \
                -e "s|^  url: CHANGEME|  url: git@github.com:example-org/example-gitops.git|" \
                "$config" > "$filled"
            if grep -q CHANGEME "$filled"; then
              echo "FAIL: ${provider} still has placeholders after filling"
              exit 1
            fi
            nic validate -f "$filled"
            echo "OK: ${provider} starter behaves correctly"
          done

  publish-starters:
    name: Publish starters to quay.io
    needs: validate-starters
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Skip when no quay credentials are configured
        id: creds
        run: |
          if [ -z "${QUAY_TOKEN:-}" ]; then
            echo "no quay credentials, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pixi and nebi
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl -fsSL https://pixi.sh/install.sh -o /tmp/pixi-install.sh
          sh /tmp/pixi-install.sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          # Asset-layer bundling (config.yaml and README travelling with the
          # workspace) needs nebi >= 0.10; older versions silently ship only
          # pixi.toml and pixi.lock.
          pixi global install "nebi>=0.10"

      - name: Generate starters
        if: steps.creds.outputs.skip == 'false'
        run: ./scripts/gen-starters.sh dist/starters

      - name: Configure quay registry
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          printf '%s' "$QUAY_TOKEN" | nebi registry add --local \
            --name quay \
            --url quay.io \
            --namespace "$QUAY_NAMESPACE" \
            --username "$QUAY_USERNAME" \
            --password-stdin

      - name: Lock and publish each starter
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          for provider in local aws; do
            pushd "dist/starters/${provider}" > /dev/null
            # Resolve the toolchain now so the published bundle carries a lock.
            pixi lock
            nebi init
            nebi publish --local \
              --registry quay \
              --repo "${STARTER_REPO_PREFIX}/starter-${provider}" \
              --tag "v${version}"
            popd > /dev/null
          done

      - name: Imported starters must still be rejected unedited
        if: steps.creds.outputs.skip == 'false'
        run: |
          set -euo pipefail
          version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          for provider in local aws; do
            dest="/tmp/imported-${provider}"
            nebi import "quay.io/${QUAY_NAMESPACE}/${STARTER_REPO_PREFIX}/starter-${provider}:v${version}" -o "$dest"
            test -f "$dest/config.yaml"
            grep -q CHANGEME "$dest/config.yaml"
            echo "OK: ${provider} round-tripped with its placeholders intact"
          done
