name: Publish conda packages

# Publishes the release archives to the prefix.dev channel as conda packages,
# so `nic` can be installed with pixi.
#
# Separate from release.yml on purpose. Nothing here compiles: the recipe
# repackages assets fetched from an already-published release by URL, so this
# has to run after that release exists, and it must be able to run for a
# release cut long ago. workflow_dispatch covers backfilling versions published
# before this workflow did, and re-running an upload that failed without
# cutting a new release.
on:
  # Not `release: [published|released]`. Releases here are usually created as
  # published releases by hand, which pushes the tag and fires the release event
  # about twenty minutes before Release finishes attaching the assets this build
  # reads (v0.14.0: published 13:48:10, Release finished 14:09:20). Waiting for
  # the Release run is correct on that path and on `git push --tags`, where
  # GoReleaser drafts first and undrafts only after every upload.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.14.0'
        required: true
        type: string
      build_number:
        description: 'Conda build number. Bump to republish a corrected recipe for a version already on the channel.'
        required: false
        default: '0'
        type: string

permissions:
  contents: read   # gh release download / view
  id-token: write  # OIDC for prefix.dev trusted publishing

# Serialised, never cancelled: two runs for the same tag would race on the same
# channel filenames, and cancelling mid-loop leaves the channel half-populated.
concurrency:
  group: publish-conda
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to prefix.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Registered as the environment on the prefix.dev trusted publisher, which
    # binds the OIDC claim to it. The approval gates who approves, not what
    # runs - the guards below are what constrain the latter.
    environment: release
    # A failed or cancelled Release has nothing to repackage. And a dispatch can
    # name any ref while the approver sees only a tag string, not the branch's
    # scripts, so restricting it to main means the code this job executes has
    # been through review.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    steps:
      # main, not the triggering ref: this job runs repo scripts against assets
      # it fetches from the release API by tag, so the two are independent. The
      # scripts should always be the reviewed ones on main.
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Resolve and validate the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Through env, never a GitHub expression inside the script body:
          # the value reaches gh, sed, asset names and generated YAML, and an
          # expression is substituted into the script text before bash parses
          # it, so a quote in the tag would break out and execute.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          # The tag must name a real release, and a stable one. With the
          # workflow_run trigger there is no release-event type to filter on at
          # all, so this is the only thing keeping release candidates off the
          # channel, on both the automatic and the dispatch path.
          # stderr is kept: a rate limit, a token-scope problem or a GitHub
          # outage must not be reported as "no such release", least of all in
          # the step whose documented recovery is to re-run this workflow.
          if ! prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease 2>"$RUNNER_TEMP/gh.err")"; then
            echo "::error::could not read release $TAG: $(tr '\n' ' ' <"$RUNNER_TEMP/gh.err")"
            exit 1
          fi
          if [[ "$prerelease" != "false" ]]; then
            echo "::error::$TAG is a prerelease; only stable releases are published"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          rattler-build-version: v0.74.0
          setup-only: 'true'

      - name: Build conda packages
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/conda/build-packages.sh "$TAG" dist/conda

      - name: Upload to prefix.dev
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(find dist/conda -name '*.conda' | sort)
          # A build that emitted nothing must not report a green publish.
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "::error::no packages were built"
            exit 1
          fi
          echo "==> uploading ${#pkgs[@]} package(s)"
          for pkg in "${pkgs[@]}"; do
            echo "==> $(basename "$pkg")"
            # --skip-existing so a re-run after a partial upload resumes instead
            # of dying on the first already-published filename. It compares
            # filenames, not bytes - and the package bytes depend on the recipe
            # as well as the signed release archive, while the recipe is mutable
            # on main. Republishing a corrected recipe therefore needs a bumped
            # build number, not a re-run of this step.
            rattler-build upload prefix -c nebari-dev/nebari --skip-existing "$pkg"
          done
