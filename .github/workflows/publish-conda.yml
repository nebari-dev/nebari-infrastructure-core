name: Publish conda packages

# Publishes the release archives to the prefix.dev channel as conda packages,
# so `nic` can be installed with pixi, and then publishes the starter
# workspaces that depend on that package.
#
# The two are one workflow because the ordering is a hard dependency, not a
# preference: a starter pins `nebari-infrastructure-core` as a conda dependency,
# so `pixi lock` cannot resolve until the upload below has happened. Expressing
# that as `needs:` makes it impossible to get wrong; as two tag-triggered
# workflows it was wrong by default, since this one waits on an approval gate
# of unbounded length.
#
# Separate from release.yml on purpose. The conda job compiles nothing: the
# recipe repackages assets fetched from an already-published release by URL, so
# it has to run after that release exists, and it must be able to run for a
# release cut long ago. workflow_dispatch covers backfilling versions published
# before this workflow did, and re-running an upload that failed without
# cutting a new release.
on:
  # Not `release: [published|released]`. Releases here are usually created as
  # published releases by hand, which pushes the tag and fires the release event
  # about twenty minutes before Release finishes attaching the assets this build
  # reads (v0.14.0: published 13:48:10, Release finished 14:09:20). Waiting for
  # the Release run is correct on that path and on `git push --tags`, where
  # GoReleaser drafts first and undrafts only after every upload.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.14.0'
        required: true
        type: string
      build_number:
        description: 'Conda build number. Bump to republish a corrected recipe for a version already on the channel.'
        required: false
        default: '0'
        type: string

permissions:
  contents: read   # gh release download / view
  id-token: write  # OIDC for prefix.dev trusted publishing

# Serialised, never cancelled: two runs for the same tag would race on the same
# channel filenames, and cancelling mid-loop leaves the channel half-populated.
concurrency:
  group: publish-conda
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to prefix.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Registered as the environment on the prefix.dev trusted publisher, which
    # binds the OIDC claim to it. The approval gates who approves, not what
    # runs - the guards below are what constrain the latter.
    environment: release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # A failed or cancelled Release has nothing to repackage. And a dispatch can
    # name any ref while the approver sees only a tag string, not the branch's
    # scripts, so restricting it to main means the code this job executes has
    # been through review.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    steps:
      # main, not the triggering ref: this job runs repo scripts against assets
      # it fetches from the release API by tag, so the two are independent. The
      # scripts should always be the reviewed ones on main. That reasoning does
      # NOT carry to publish-starters below, where the checkout is the artifact.
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Resolve and validate the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Through env, never a GitHub expression inside the script body:
          # the value reaches gh, sed, asset names and generated YAML, and an
          # expression is substituted into the script text before bash parses
          # it, so a quote in the tag would break out and execute.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          # The tag must name a real release, and a stable one. With the
          # workflow_run trigger there is no release-event type to filter on at
          # all, so this is the only thing keeping release candidates off the
          # channel, on both the automatic and the dispatch path.
          # stderr is kept: a rate limit, a token-scope problem or a GitHub
          # outage must not be reported as "no such release", least of all in
          # the step whose documented recovery is to re-run this workflow.
          if ! prerelease="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease 2>"$RUNNER_TEMP/gh.err")"; then
            echo "::error::could not read release $TAG: $(tr '\n' ' ' <"$RUNNER_TEMP/gh.err")"
            exit 1
          fi
          if [[ "$prerelease" != "false" ]]; then
            echo "::error::$TAG is a prerelease; only stable releases are published"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          rattler-build-version: v0.74.0
          setup-only: 'true'

      - name: Build conda packages
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/conda/build-packages.sh "$TAG" dist/conda

      - name: Upload to prefix.dev
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(find dist/conda -name '*.conda' | sort)
          # A build that emitted nothing must not report a green publish.
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "::error::no packages were built"
            exit 1
          fi
          echo "==> uploading ${#pkgs[@]} package(s)"
          for pkg in "${pkgs[@]}"; do
            echo "==> $(basename "$pkg")"
            # --skip-existing so a re-run after a partial upload resumes instead
            # of dying on the first already-published filename. It compares
            # filenames, not bytes - and the package bytes depend on the recipe
            # as well as the signed release archive, while the recipe is mutable
            # on main. Republishing a corrected recipe therefore needs a bumped
            # build number, not a re-run of this step.
            rattler-build upload prefix -c nebari-dev/nebari --skip-existing "$pkg"
          done

  publish-starters:
    name: Publish starters to quay.io
    # The whole point of this file: the starters pin nic as a conda dependency,
    # so this cannot run until the upload above succeeded.
    needs: publish
    # No OIDC here: the Quay push uses a static token from the environment.
    permissions:
      contents: read
    # Only on the automatic path. A dispatch exists to backfill an old tag's
    # conda package or to retry a failed upload; neither is a reason to
    # republish that tag's starter bundles, and republishing a released bundle
    # is the one thing the old tag-only guard existed to prevent.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Approval + deployment-branch gate, matching every other credentialed job
    # in this repo (release.yml, the deployment-tests cloud jobs).
    environment: quay-publish
    env:
      # Starters publish under the existing nebari project, in a starters/
      # subdir, mirroring how the charts live at quay.io/nebari/charts. The
      # provider alone names the repo: quay.io/nebari/starters/aws, not
      # .../starters/starter-aws, which stutters in the reference a user types.
      QUAY_NAMESPACE: nebari
      STARTER_REPO_PREFIX: starters
      # Validated upstream against the release API, so it is a real stable tag.
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      # The tag, not main. Unlike the job above, which fetches its artifact from
      # the release API and only needs scripts, here the checkout IS the
      # artifact: cmd/starters renders from starters/templates, examples/ and
      # the pkg/tofu constraint in the working tree. Publishing main's content
      # under a released tag would let anything merged during the approval
      # window change what starters/<provider>:vX means, and a re-run later
      # would rewrite it again. The tag is validated as a real stable release
      # above, so "the code has been through review" still holds.
      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.publish.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nic and put it on PATH
        shell: bash
        run: |
          set -euo pipefail
          make build
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Install pixi and nebi
        shell: bash
        run: |
          set -euo pipefail
          # Installer pinned to the v0.77.0 tag commit; PIXI_VERSION pins the
          # binary it fetches. Same shape as the k3d pin in deployment-tests.
          curl -fsSL https://raw.githubusercontent.com/prefix-dev/pixi/e3c26fbf7d8294d4ddbe7c913b4f8e60bcbafe5a/install/install.sh \
            | PIXI_VERSION=v0.77.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          # Asset-layer bundling (config.yaml and the README travelling with the
          # workspace) needs nebi >= 0.10; older versions silently ship only
          # pixi.toml and pixi.lock. Pinned so a credentialed job never resolves
          # a floating dependency at run time.
          # Floor plus ceiling rather than ==, so patch releases are allowed.
          # Channel pinned explicitly: this job holds the Quay push token, and
          # an unpinned channel decides which build of nebi runs beside it.
          pixi global install -c conda-forge "nebi>=0.13,<0.14"

      - name: Generate starters
        shell: bash
        run: |
          set -euo pipefail
          # -version explicitly even though the checkout is the tag: the git
          # describe fallback needs tag objects a ref checkout does not fetch,
          # and cmd/starters treats an empty -version as unset and falls back
          # to it silently.
          : "${TAG:?resolved tag is empty}"
          go run ./cmd/starters -out dist/starters -version "${TAG#v}"

      - name: Configure quay registry
        shell: bash
        env:
          # Username is a variable, token is a secret; both scoped to the
          # quay-publish environment.
          QUAY_USERNAME: ${{ vars.QUAY_OCI_STARTERS_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_OCI_STARTERS_TOKEN }}
        run: |
          set -euo pipefail
          : "${QUAY_USERNAME:?QUAY_OCI_STARTERS_USERNAME is not set for this environment}"
          : "${QUAY_TOKEN:?QUAY_OCI_STARTERS_TOKEN is not set for this environment}"
          printf '%s' "$QUAY_TOKEN" | nebi registry add --local \
            --name quay \
            --url quay.io \
            --namespace "$QUAY_NAMESPACE" \
            --username "$QUAY_USERNAME" \
            --password-stdin

      - name: Lock and publish each starter
        shell: bash
        run: |
          set -euo pipefail
          for provider in local aws; do
            pushd "dist/starters/${provider}" > /dev/null
            # Resolves against the channel the job above just published to.
            pixi lock
            nebi init
            nebi publish --local \
              --registry quay \
              --repo "${STARTER_REPO_PREFIX}/${provider}" \
              --tag "$TAG"
            popd > /dev/null
          done

      - name: Imported starters still carry their placeholders
        shell: bash
        run: |
          set -euo pipefail
          for provider in local aws; do
            dest="/tmp/imported-${provider}"
            nebi import "quay.io/${QUAY_NAMESPACE}/${STARTER_REPO_PREFIX}/${provider}:${TAG}" -o "$dest"
            test -f "$dest/config.yaml"
            test -f "$dest/README.md"
            grep -q CHANGEME "$dest/config.yaml"
            # The published bundle must be rejected unedited, same as the
            # freshly generated one.
            if nic validate -f "$dest/config.yaml"; then
              echo "::error::published ${provider} starter validates unedited"
              exit 1
            fi
            echo "OK: ${provider} round-tripped and is still not deployable as-is"
          done
