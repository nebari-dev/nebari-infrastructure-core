name: Publish starters

# Publishes the per-provider Nebi starter workspaces to quay.io for released
# versions of nic.
#
# This used to be a job in `release.yml`, ordered behind the conda upload by a
# `needs:` edge. That edge existed because the starters pin nic as a conda
# dependency and `pixi lock` cannot resolve until the package is on the channel.
# Now that nic reaches prefix.dev through the shared `github-releases` channel,
# the package lands whenever octoconda next picks the repository up, which can
# be many hours after the release (see docs/operations/packaging.md).
#
# So the ordering became a wait rather than an edge. `release.yml` fires this
# workflow once (it usually finds the channel not ready), and an hourly cron
# fires it again until the channel catches up. Two jobs keep that cheap and safe:
#
#   check    no environment, no secrets. Decides, per release and per provider,
#            whether anything is left to publish and whether the channel can
#            serve it yet. Most runs end here.
#   publish  gated by the `quay-publish` environment, so an approval is only
#            ever requested when there is something to push. Runs once per
#            release that needs it, from that release's own tag checkout, and
#            re-checks quay before each push.
#
# Every decision is re-derived from quay and the channel on each run, so a
# publish that failed is picked up again on a later tick, and nothing already on
# quay is republished.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish starters for (e.g. v0.15.0). Defaults to the recent stable releases.'
        required: false
        type: string
  schedule:
    # Hourly. The check job holds no secrets and needs no approval, so a tick
    # that finds nothing to do costs one short runner, and polling often keeps
    # tag-to-starters close to whenever the channel actually catches up.
    - cron: '17 * * * *'

permissions:
  contents: read

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: nebari
  STARTER_REPO_PREFIX: starters
  CHANNEL: https://prefix.dev/github-releases
  # Each provider cmd/starters renders, with the first release that shipped its
  # starter. A provider is only expected for releases at or after its floor, so
  # adding one here (with the next release as its floor) never makes an older
  # tag look incomplete. The publish job fails if a tag renders a different set
  # than this expects for it, so a provider cannot be silently skipped.
  STARTER_PROVIDERS: 'local:0.14.0 aws:0.14.0'

jobs:
  check:
    name: What needs publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.channel.outputs.pending }}
    steps:
      - name: Candidate releases
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A dispatch may name one tag; a cron looks at the last few stable
          # releases, so a release that was missed while a newer one was cut is
          # still picked up. Drafts and prereleases are excluded: no channel
          # will ever carry an rc for a starter to lock against.
          if ! releases="$(gh release list --repo "$GITHUB_REPOSITORY" \
                             --exclude-pre-releases --exclude-drafts --limit 5 \
                             --json tagName,publishedAt 2>"$RUNNER_TEMP/gh.err")"; then
            echo "::error::could not list releases: $(tr '\n' ' ' <"$RUNNER_TEMP/gh.err")"
            exit 1
          fi
          if [[ -n "${INPUT_TAG:-}" ]]; then
            releases="$(jq -c --arg t "$INPUT_TAG" '[.[] | select(.tagName == $t)]' <<<"$releases")"
            if [[ "$(jq length <<<"$releases")" -eq 0 ]]; then
              echo "::error::$INPUT_TAG is not among the recent stable releases"
              exit 1
            fi
          fi
          # Same shape release.yml enforces. Anything else was not cut by our
          # release process and gets no starters.
          bad="$(jq -r '.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") | not)' <<<"$releases")"
          if [[ -n "$bad" ]]; then
            echo "::error::unexpected stable release tag(s): $bad"
            exit 1
          fi
          # Releases older than every provider's floor never had starters and
          # are not candidates, rather than being reported missing every tick.
          # Oldest first, so when several releases publish in one run, the
          # newest is pushed last and ends up as :latest.
          jq -c --arg providers "$STARTER_PROVIDERS" '
              def v: ltrimstr("v") | split(".") | map(tonumber);
              ($providers | split(" ") | map(split(":")[1] | v) | min) as $since
              | map(select((.tagName | v) >= $since)) | sort_by(.tagName | v)
            ' <<<"$releases" > "$RUNNER_TEMP/releases.json"
          if [[ "$(jq length "$RUNNER_TEMP/releases.json")" -eq 0 ]]; then
            echo "::error::no candidate release has starters to publish"
            exit 1
          fi
          echo "==> candidates: $(jq -r 'map(.tagName) | join(" ")' "$RUNNER_TEMP/releases.json")"

      # Checked before the channel: one anonymous request per tag and provider,
      # so a steady-state tick (everything already published) never installs
      # pixi or downloads repodata.
      - name: What is already on quay
        run: |
          set -euo pipefail
          # Duplicated in the publish job, which runs from the release tag's
          # tree and so cannot source a helper from main. Keep the two in step.
          #
          # Every failure returns non-zero explicitly: this runs inside $(...),
          # where bash does not apply errexit, and a failure that fell through
          # to the manifest request would get a 401 and read as "absent".
          probe() {  # probe <provider> <tag> -> prints present|absent
            local repo="${QUAY_NAMESPACE}/${STARTER_REPO_PREFIX}/$1" resp token code
            resp="$(curl -fsS "https://${QUAY_REGISTRY}/v2/auth?service=${QUAY_REGISTRY}&scope=repository:${repo}:pull")" \
              || { echo "::error::could not get a pull token from ${QUAY_REGISTRY} for ${repo}" >&2; return 1; }
            token="$(jq -r '.token // empty' <<<"$resp")" \
              || { echo "::error::unreadable token response from ${QUAY_REGISTRY} for ${repo}" >&2; return 1; }
            [[ -n "$token" ]] \
              || { echo "::error::${QUAY_REGISTRY} returned no token for ${repo}" >&2; return 1; }
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${token}" \
                      -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json' \
                      "https://${QUAY_REGISTRY}/v2/${repo}/manifests/$2")" \
              || { echo "::error::could not reach ${QUAY_REGISTRY} for ${repo}:$2" >&2; return 1; }
            case "$code" in
              200) echo present ;;
              # 404: the repository exists, the tag does not. 401 (with a
              # valid token, checked above): the repository does not exist
              # yet, which is what a new provider looks like before its first
              # publish.
              404|401) echo absent ;;
              # Anything else is a real failure. Treating it as absent would
              # republish on every tick during a quay outage.
              *) echo "::error::unexpected HTTP $code probing ${QUAY_REGISTRY} for ${repo}:$2" >&2; return 1 ;;
            esac
          }
          missing=()
          for entry in $STARTER_PROVIDERS; do
            provider="${entry%%:*}"
            floor="${entry#*:}"
            # Releases are oldest first, so every absent tag seen before a
            # present one is older than something already published.
            absent=()
            for tag in $(jq -r --arg floor "$floor" '
                def v: ltrimstr("v") | split(".") | map(tonumber);
                .[] | select((.tagName | v) >= ($floor | v)) | .tagName
              ' "$RUNNER_TEMP/releases.json"); do
              state="$(probe "$provider" "$tag")"
              if [[ "$state" == present ]]; then
                # nebi publish always moves :latest too, so backfilling a
                # release older than one already on quay would move :latest
                # backwards. Surfaced rather than published.
                for old in "${absent[@]}"; do
                  echo "::warning::$provider:$old has no starter, but $tag is already on quay; publishing it here would move :latest back. Publish it by hand and re-tag :latest."
                done
                absent=()
              else
                absent+=("$tag")
              fi
            done
            for tag in "${absent[@]}"; do
              echo "==> $provider:$tag not on quay yet"
              missing+=("$(jq -cn --arg t "$tag" --arg p "$provider" '{tag: $t, provider: $p}')")
            done
          done
          printf '%s\n' "${missing[@]}" | jq -s 'map(select(. != null))' > "$RUNNER_TEMP/missing.json"

      - name: Install pixi
        run: |
          set -euo pipefail
          if [[ "$(jq length "$RUNNER_TEMP/missing.json")" -eq 0 ]]; then
            exit 0
          fi
          # Installer pinned to the v0.77.0 tag commit; PIXI_VERSION pins the
          # binary it fetches. Same shape as the k3d pin in deployment-tests.
          curl -fsSL https://raw.githubusercontent.com/prefix-dev/pixi/e3c26fbf7d8294d4ddbe7c913b4f8e60bcbafe5a/install/install.sh \
            | PIXI_VERSION=v0.77.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      # Asked by resolving a throwaway workspace against the real channel rather
      # than by parsing repodata: the question is precisely "can pixi lock find
      # it on every platform the starter declares", so the resolver, given the
      # starter's own platform list, is the honest way to ask.
      - name: Is each release on the channel yet?
        id: channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # How long before "not on the channel yet" is worth a warning.
          # octoconda only spot-checks packages that already have its maximum
          # number of versions, so there is no upper bound on the delay and
          # half a day is ordinary. This never fails the run: a warning after a
          # day is a prompt to look, not proof that anything is broken.
          WARN_AFTER_HOURS: 24
        run: |
          set -euo pipefail
          late=()
          pending='[]'
          for tag in $(jq -r '[.[].tag] | unique_by(ltrimstr("v") | split(".") | map(tonumber)) | .[]' "$RUNNER_TEMP/missing.json"); do
            version="${tag#v}"
            # The platforms the starter will lock for, read from that release's
            # own template, so a package that has landed for some platforms but
            # not others is not mistaken for ready.
            if ! template="$(gh api -H 'Accept: application/vnd.github.raw' \
                               "repos/${GITHUB_REPOSITORY}/contents/starters/templates/pixi.toml.tmpl?ref=${tag}" \
                               2>"$RUNNER_TEMP/gh.err")"; then
              # A tag cut before cmd/starters existed (v0.14.0 is one: its
              # starters were built from a later tree) cannot be published
              # from its own checkout, so it is reported, not attempted.
              if grep -q 'HTTP 404' "$RUNNER_TEMP/gh.err"; then
                echo "::warning::$tag predates the starter templates, so its starters cannot be built from the tag; publish them by hand if they are missing"
                continue
              fi
              echo "::error::could not read the starter template at $tag: $(tr '\n' ' ' <"$RUNNER_TEMP/gh.err")"
              exit 1
            fi
            platforms="$(awk '/^platforms[[:space:]]*=/ { sub(/^[^=]*=[[:space:]]*/, ""); print; exit }' <<<"$template")"
            if [[ -z "$platforms" ]]; then
              echo "::error::no workspace platforms line in the starter template at $tag"
              exit 1
            fi
            probe="$RUNNER_TEMP/probe-$version"
            mkdir -p "$probe"
            cat > "$probe/pixi.toml" <<EOF
          [workspace]
          name = "channel-probe"
          channels = ["conda-forge", "${CHANNEL}"]
          platforms = ${platforms}
          version = "0.0.0"

          [dependencies]
          nebari-infrastructure-core = "==${version}"
          EOF
            if (cd "$probe" && "$HOME/.pixi/bin/pixi" lock --quiet 2>"$probe/lock.err"); then
              providers="$(jq -r --arg t "$tag" '[.[] | select(.tag == $t) | .provider] | join(" ")' "$RUNNER_TEMP/missing.json")"
              # Every provider this release should render, whether or not it is
              # missing, so the publish job can check cmd/starters against it.
              expected="$(for entry in $STARTER_PROVIDERS; do
                            jq -rn --arg p "${entry%%:*}" --arg f "${entry#*:}" --arg v "$version" '
                                def v: split(".") | map(tonumber);
                                if ($v | v) >= ($f | v) then $p else empty end'
                          done | xargs)"
              pending="$(jq -c --arg t "$tag" --arg v "$version" --arg p "$providers" --arg e "$expected" \
                           '. + [{tag: $t, version: $v, providers: $p, expected: $e}]' <<<"$pending")"
              echo "==> $tag is on the channel for ${platforms}; will publish: $providers"
              continue
            fi
            published="$(jq -r --arg t "$tag" '.[] | select(.tagName == $t) | .publishedAt' "$RUNNER_TEMP/releases.json")"
            age_hours=$(( ( $(date +%s) - $(date -d "$published" +%s) ) / 3600 ))
            if (( age_hours >= WARN_AFTER_HOURS )); then
              # Kept in the log: this is what tells "octoconda has not got to
              # us yet" apart from "the channel URL is wrong".
              cat "$probe/lock.err" >&2 || true
              late+=("$tag (${age_hours}h)")
            else
              echo "::notice::$tag is not on ${CHANNEL} yet (${age_hours}h since release); a later run will retry"
            fi
          done
          # Kept in release order, so the newest release is published last.
          pending="$(jq -c 'sort_by(.version | split(".") | map(tonumber))' <<<"$pending")"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if (( ${#late[@]} > 0 )); then
            echo "::warning::still not on ${CHANNEL} ${WARN_AFTER_HOURS}h+ after release: ${late[*]}. Usually octoconda has simply not reached us yet; if it persists, check that octoconda still lists this repository (see docs/operations/packaging.md). A later run will retry."
          fi

  publish:
    name: Publish ${{ matrix.tag }}
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.pending != '' && needs.check.outputs.pending != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One release at a time, in the order check emitted them (oldest first),
      # so the last :latest written is the newest release. fail-fast stops the
      # newer releases when an older one fails: publishing a newer one would
      # leave the older one behind a present tag, where check only warns about
      # it instead of retrying it.
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.check.outputs.pending) }}
    concurrency:
      # Keyed on the workflow, not the tag: two overlapping runs would resolve
      # the same pending releases and race each other to publish them.
      group: publish-starters
      cancel-in-progress: false
    # Needs required reviewers, and a deployment-branch policy of `main` only:
    # both the cron and the dispatch from release.yml run this workflow from
    # main. See docs/operations/verifying-releases.md.
    environment: quay-publish
    permissions:
      contents: read  # no OIDC here; the Quay push uses a static token
    env:
      TAG: ${{ matrix.tag }}
      VERSION: ${{ matrix.version }}
      PROVIDERS: ${{ matrix.providers }}
      EXPECTED_PROVIDERS: ${{ matrix.expected }}

    steps:
      # The release's own tree, not the branch the run was triggered from. The
      # run executes on main, and the starters for vX must carry vX's examples,
      # templates and OpenTofu window, validated by vX's nic.
      - name: Checkout the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nic and put it on PATH
        shell: bash
        run: |
          set -euo pipefail
          make build
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Install pixi and nebi
        shell: bash
        run: |
          set -euo pipefail
          # Installer pinned to the v0.77.0 tag commit; PIXI_VERSION pins the
          # binary it fetches. Same shape as the k3d pin in deployment-tests.
          curl -fsSL https://raw.githubusercontent.com/prefix-dev/pixi/e3c26fbf7d8294d4ddbe7c913b4f8e60bcbafe5a/install/install.sh \
            | PIXI_VERSION=v0.77.0 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pixi/bin:$PATH"
          # Asset-layer bundling (config.yaml and the README travelling with the
          # workspace) needs nebi >= 0.10; older versions silently ship only
          # pixi.toml and pixi.lock. Floor plus ceiling rather than ==, so patch
          # releases are allowed. Channel pinned explicitly: this job holds the
          # Quay push token, and an unpinned channel decides which build of nebi
          # runs beside it.
          pixi global install -c conda-forge "nebi>=0.13,<0.14"

      - name: Generate starters
        shell: bash
        run: |
          set -euo pipefail
          : "${VERSION:?version is empty}"
          # -version explicitly rather than cmd/starters' git describe fallback,
          # which needs tag objects and treats an empty value as unset.
          go run ./cmd/starters -out dist/starters -version "$VERSION"
          rendered="$(find dist/starters -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | xargs)"
          expected="$(tr ' ' '\n' <<<"$EXPECTED_PROVIDERS" | sort | xargs)"
          if [[ "$rendered" != "$expected" ]]; then
            echo "::error::$TAG renders [$rendered] but STARTER_PROVIDERS expects [$expected] for it; update STARTER_PROVIDERS"
            exit 1
          fi

      - name: Configure quay registry
        shell: bash
        env:
          QUAY_USERNAME: ${{ vars.QUAY_OCI_STARTERS_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_OCI_STARTERS_TOKEN }}
        run: |
          set -euo pipefail
          : "${QUAY_USERNAME:?QUAY_OCI_STARTERS_USERNAME is not set}"
          : "${QUAY_TOKEN:?QUAY_OCI_STARTERS_TOKEN is not set}"
          printf '%s' "$QUAY_TOKEN" | nebi registry add --local \
            --name quay \
            --url "$QUAY_REGISTRY" \
            --namespace "$QUAY_NAMESPACE" \
            --username "$QUAY_USERNAME" \
            --password-stdin

      # Only the providers check found missing are touched, each one re-checked
      # on quay, then locked, published and round-tripped before the next
      # starts. The re-check covers an overlapping run (the release's dispatch
      # and a cron tick, or an approval left waiting) that published the same
      # tag after check ran. A failed round-trip leaves that tag on quay, and
      # later runs see it as present, so the red run is the signal: delete the
      # tag on quay and re-dispatch.
      - name: Lock, publish and verify each missing starter
        shell: bash
        run: |
          set -euo pipefail
          # Same as the check job's probe; see the note there.
          probe() {  # probe <provider> <tag> -> prints present|absent
            local repo="${QUAY_NAMESPACE}/${STARTER_REPO_PREFIX}/$1" resp token code
            resp="$(curl -fsS "https://${QUAY_REGISTRY}/v2/auth?service=${QUAY_REGISTRY}&scope=repository:${repo}:pull")" \
              || { echo "::error::could not get a pull token from ${QUAY_REGISTRY} for ${repo}" >&2; return 1; }
            token="$(jq -r '.token // empty' <<<"$resp")" \
              || { echo "::error::unreadable token response from ${QUAY_REGISTRY} for ${repo}" >&2; return 1; }
            [[ -n "$token" ]] \
              || { echo "::error::${QUAY_REGISTRY} returned no token for ${repo}" >&2; return 1; }
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${token}" \
                      -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json' \
                      "https://${QUAY_REGISTRY}/v2/${repo}/manifests/$2")" \
              || { echo "::error::could not reach ${QUAY_REGISTRY} for ${repo}:$2" >&2; return 1; }
            case "$code" in
              200) echo present ;;
              404|401) echo absent ;;
              *) echo "::error::unexpected HTTP $code probing ${QUAY_REGISTRY} for ${repo}:$2" >&2; return 1 ;;
            esac
          }
          for provider in $PROVIDERS; do
            # Assigned first, not tested inline: inside [[ ]] a failed probe
            # would compare as "absent" and push anyway.
            state="$(probe "$provider" "$TAG")"
            if [[ "$state" == present ]]; then
              echo "::notice::${provider}:${TAG} appeared on quay since check ran; skipping"
              continue
            fi
            pushd "dist/starters/${provider}" > /dev/null
            # Resolves against the shared github-releases channel, which the
            # check job confirmed carries this version for these platforms.
            pixi lock
            nebi init
            nebi publish --local \
              --registry quay \
              --repo "${STARTER_REPO_PREFIX}/${provider}" \
              --tag "$TAG"
            popd > /dev/null

            dest="$RUNNER_TEMP/imported-${provider}"
            nebi import "${QUAY_REGISTRY}/${QUAY_NAMESPACE}/${STARTER_REPO_PREFIX}/${provider}:${TAG}" -o "$dest"
            test -f "$dest/config.yaml"
            test -f "$dest/README.md"
            grep -q CHANGEME "$dest/config.yaml"
            # The published bundle must be rejected unedited, same as the
            # freshly generated one.
            if nic validate -f "$dest/config.yaml"; then
              echo "::error::published ${provider} starter validates unedited"
              exit 1
            fi
            echo "OK: ${provider}:${TAG} round-tripped and is still not deployable as-is"
          done
