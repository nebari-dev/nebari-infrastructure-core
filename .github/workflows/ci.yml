name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  test-journeys-lib:
    name: Journey library tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: tests/user_journeys/pixi.toml
          # Both, space separated: `make test-journeys-lib` runs in the
          # default environment and the lint step runs in `dev`. Naming
          # only `dev` would leave the default environment uninstalled.
          environments: >-
            default
            dev

      # These are unit tests of the journey action library
      # (tests/user_journeys/nebari_journeys). They need NO cluster, so they
      # run here in the fast lane rather than in the journey job, and they
      # gate every PR: the library is what the journeys are written in, and
      # nothing else would catch it drifting.
      - name: Run journey library tests
        run: make test-journeys-lib

      - name: Lint the journey suite
        run: cd tests/user_journeys && pixi run --environment dev lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nic
          path: nic
          retention-days: 1

  deploy-and-journeys:
    name: Deploy & user journeys
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Deploy
        uses: nebari-dev/deploy-nebari-action@13484a5f9f42f8378b88d4426d3b0244522e347d # v0.3.0
        with:
          nic-binary: nic

      # There is deliberately no step installing the gateway's certificate
      # into the runner's system trust store. An earlier version had one, on
      # the stated grounds that OpenSSL -- and therefore the requests-based
      # journeys -- would read it. That is not true inside a pixi
      # environment, which resolves its own CA material:
      #
      #   requests default CA bundle: .pixi/envs/default/.../certifi/cacert.pem
      #   openssl default verify paths: .pixi/envs/default/ssl/cert.pem
      #
      # So `update-ca-certificates` on the runner was invisible to the suite.
      # Nothing needs it either: the API journeys pass the anchor explicitly
      # via `verify=` from the `trust_anchor` fixture, Chromium is pinned to
      # the anchor's SPKI hash when and only when the chain is not publicly
      # trusted (see nebari_journeys.trust.classify_anchor), and `verify=True`
      # is only ever reached on a publicly trusted cluster anyway.
      - name: Run user journey tests
        timeout-minutes: 20
        uses: ./.github/actions/run-user-journeys
        with:
          artifact-name: journey-artifacts

      - name: Verify docs are up-to-date
        run: |
          make docs
          git add -N docs/reference/cli docs/configuration
          git diff --exit-code -- docs/reference/cli docs/configuration

  workflow-pins:
    name: Workflow pins & release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check action pins
        run: ./scripts/check-action-pins.sh

      - name: Lint workflow files
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          # Print findings to the job log instead of posting anywhere; this
          # step's job is to fail the build, not to comment on commits or
          # pull requests, so no extra GitHub API permissions are needed.
          reporter: local
          filter_mode: nofilter
          fail_level: error

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Run vulnerability gate
        run: ./scripts/govulncheck-gate.sh
