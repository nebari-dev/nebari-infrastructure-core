name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nic
          path: nic
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Deploy
        uses: nebari-dev/deploy-nebari-action@204a274e743397d45c79318aa21210bdd06b3dac # v0.2.0
        with:
          nic-binary: nic

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: tests/user_journeys/pixi.toml

      - name: Install cluster trust anchor for Chromium
        # Chromium never trusts a custom CA through a Playwright context
        # option (ignore_https_errors is forbidden in this suite); it reads
        # the OS/NSS trust store instead. On the GitHub-hosted Ubuntu
        # runner, update-ca-certificates also feeds NSS through p11-kit,
        # which is what Chromium reads, so this step is what makes a
        # selfsigned gateway certificate trusted for the browser journeys
        # without weakening TLS anywhere. It reuses
        # nebari_journeys.trust.trust_anchor_pem so the CI path and the
        # trust_anchor fixture agree on which key (ca.crt, then tls.crt)
        # is the anchor. When neither key exists, the gateway certificate
        # is publicly trusted (ACME) and the system store is left as-is.
        run: |
          set -euo pipefail
          cd tests/user_journeys
          pem="$(pixi run python -c '
          from nebari_journeys.cluster import Cluster
          from nebari_journeys.trust import trust_anchor_pem
          anchor = trust_anchor_pem(Cluster.connect())
          print(anchor or "", end="")
          ')"
          if [ -n "$pem" ]; then
            echo "$pem" | sudo tee /usr/local/share/ca-certificates/nebari-gateway.crt > /dev/null
            sudo update-ca-certificates
          else
            echo "no gateway CA secret found; using the system trust store as-is"
          fi

      - name: Run user journey tests
        run: make test-journeys

      - name: Upload journey failure artifacts
        # The `test` pixi task (see pixi.toml) passes --tracing=retain-on-failure,
        # --screenshot=only-on-failure and --video=retain-on-failure, so a
        # trace, screenshot and video land in test-results/ only for a
        # failing browser journey. Retention is deliberately short: a
        # Playwright trace from a failed login journey can contain the
        # throwaway user's password, and Playwright has no trace redaction
        # API, so short retention plus throwaway credentials (scratch_user,
        # not admin credentials) are the actual control here, not a
        # convenience setting. Do not raise retention-days without also
        # solving redaction.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-artifacts
          path: |
            tests/user_journeys/test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Verify docs are up-to-date
        run: |
          make docs
          git add -N docs/reference/cli docs/configuration
          git diff --exit-code -- docs/reference/cli docs/configuration

  workflow-pins:
    name: Workflow pins & release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check action pins
        run: ./scripts/check-action-pins.sh

      - name: Lint workflow files
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          # Print findings to the job log instead of posting anywhere; this
          # step's job is to fail the build, not to comment on commits or
          # pull requests, so no extra GitHub API permissions are needed.
          reporter: local
          filter_mode: nofilter
          fail_level: error

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Run vulnerability gate
        run: ./scripts/govulncheck-gate.sh
