name: Deployment Tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to deploy and test
        type: choice
        options:
          - all
          - local
          - aws
          - azure
          - hetzner
          - existing
        default: local
  release:
    # published covers both stable and pre-releases
    types: [published]
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nic
          path: nic
          retention-days: 1

  local:
    name: Local
    needs: build
    if: >-
      github.event_name == 'release' || github.event_name == 'pull_request' ||
      inputs.provider == 'local' || inputs.provider == 'all'
    runs-on: ubuntu-latest
    # Serialize runs so every job resets its own gitops branch at start. An
    # overlapping run would wipe the branch under the in-flight one. The
    # running test always finishes and at most one newer run stays queued.
    # Later triggers replace the queued run.
    concurrency:
      group: deploy-test-local
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Reset gitops branch
        uses: ./.github/actions/reset-gitops-branch
        with:
          branch: local
          token: ${{ secrets.NIC_CI_GITOPS_TOKEN }}

      - name: Deploy
        uses: ./.github/actions/deploy
        env:
          GIT_TOKEN: ${{ secrets.NIC_CI_GITOPS_TOKEN }}
        with:
          config: .github/fixtures/deploy/local-config.yaml
          nic-binary: nic

  aws:
    name: AWS
    needs: build
    if: >-
      github.event_name == 'release' || github.event_name == 'pull_request' ||
      inputs.provider == 'aws' || inputs.provider == 'all'
    runs-on: ubuntu-latest
    environment: aws
    # Only one AWS deploy test at a time and the running one is never cancelled.
    # At most one newer run queues. Later triggers replace the queued run.
    concurrency:
      group: deploy-test-aws
      cancel-in-progress: false
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Reset gitops branch
        uses: ./.github/actions/reset-gitops-branch
        with:
          branch: aws
          token: ${{ secrets.NIC_CI_GITOPS_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
          # The default duration is 3600 seconds (one hour), so we bump it
          # to 7200 seconds (two hours) to give it room to deploy and destroy.
          role-duration-seconds: 7200

      - name: Deploy
        uses: ./.github/actions/deploy
        # Leave around 30 minutes for the post hook to destroy the cluster
        timeout-minutes: 90
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GIT_TOKEN: ${{ secrets.NIC_CI_GITOPS_TOKEN }}
        with:
          config: .github/fixtures/deploy/aws-config.yaml
          nic-binary: nic
          wait-timeout: '1800'

  azure:
    name: Azure
    needs: build
    if: >-
      github.event_name == 'release' || github.event_name == 'pull_request' ||
      inputs.provider == 'azure' || inputs.provider == 'all'
    runs-on: ubuntu-latest
    environment: azure
    # Only one Azure deploy test at a time and the running one is never cancelled.
    # At most one newer run queues. Later triggers replace the queued run.
    concurrency:
      group: deploy-test-azure
      cancel-in-progress: false
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Reset gitops branch
        uses: ./.github/actions/reset-gitops-branch
        with:
          branch: azure
          token: ${{ secrets.NIC_CI_GITOPS_TOKEN }}

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: ./.github/actions/deploy
        # Leave around 30 minutes for the post hook to destroy the cluster
        timeout-minutes: 90
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GIT_TOKEN: ${{ secrets.NIC_CI_GITOPS_TOKEN }}
        with:
          config: .github/fixtures/deploy/azure-config.yaml
          nic-binary: nic
          wait-timeout: '1800'

  hetzner:
    name: Hetzner
    needs: build
    if: >-
      github.event_name == 'release' || github.event_name == 'pull_request' ||
      inputs.provider == 'hetzner' || inputs.provider == 'all'
    runs-on: ubuntu-latest
    environment: hetzner
    # Only one Hetzner deploy test at a time and the running one is never cancelled.
    # At most one newer run queues. Later triggers replace the queued run.
    concurrency:
      group: deploy-test-hetzner
      cancel-in-progress: false
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Reset gitops branch
        uses: ./.github/actions/reset-gitops-branch
        with:
          branch: hetzner
          token: ${{ secrets.NIC_CI_GITOPS_TOKEN }}

      - name: Deploy
        uses: ./.github/actions/deploy
        # Leave around 15 minutes for the post hook to destroy the cluster
        timeout-minutes: 45
        env:
          HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GIT_TOKEN: ${{ secrets.NIC_CI_GITOPS_TOKEN }}
        with:
          config: .github/fixtures/deploy/hetzner-config.yaml
          nic-binary: nic
          wait-timeout: '1800'

  existing:
    name: Existing
    needs: build
    if: >-
      github.event_name == 'release' || github.event_name == 'pull_request' ||
      inputs.provider == 'existing' || inputs.provider == 'all'
    runs-on: ubuntu-latest
    # See the local job for the concurrency rationale.
    concurrency:
      group: deploy-test-existing
      cancel-in-progress: false
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nic

      # Artifacts don't preserve file permissions
      - name: Make binary executable
        run: chmod +x nic

      - name: Reset gitops branch
        uses: ./.github/actions/reset-gitops-branch
        with:
          branch: existing
          token: ${{ secrets.NIC_CI_GITOPS_TOKEN }}

      # Disable Traefik as NIC will deploy its own Envoy gateway LoadBalancer.
      # Also, pass --no-lb to drop k3d's external proxy container, which is
      # unnecessary on a Linux runner where the node IP is directly routable.
      - name: Create k3d cluster
        run: |
          # Install script pinned to the v5.9.0 tag commit. TAG pins the binary it fetches
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/15dd1e2dbd62c53ed990fce9b7332335e8cb053c/install.sh | TAG=v5.9.0 bash
          k3d cluster create existing-ci \
            --image rancher/k3s:v1.36.2-k3s1@sha256:6a47cea22c4b834d4ba72c89d291696b79ebe406251f90b446e4dff03513dd87 \
            --no-lb \
            --k3s-arg "--disable=traefik@server:0" \
            --wait --timeout 120s
          kubectl wait --for=condition=Ready nodes --all --timeout=60s

      - name: Deploy
        uses: ./.github/actions/deploy
        env:
          GIT_TOKEN: ${{ secrets.NIC_CI_GITOPS_TOKEN }}
        with:
          config: .github/fixtures/deploy/existing-config.yaml
          nic-binary: nic
