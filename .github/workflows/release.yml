name: Release

# Cuts the release, then hands off to the starter-workspace publish.
#
# NIC no longer builds or uploads its own conda package. The binary reaches
# prefix.dev through the shared `github-releases` channel, which octoconda
# repackages from published GitHub releases with no recipe on our side. That
# makes publication asynchronous: the package lands whenever octoconda next
# picks the repository up, which is often many hours after the release and has
# no upper bound (see docs/operations/packaging.md), well after this run ends.
#
# The starters pin nic as a conda dependency, so their `pixi lock` cannot
# resolve until that has happened. Rather than hold a runner waiting, this
# workflow only *fires* the starter publish; `publish-starters.yml` no-ops when
# the channel is not ready yet and its own cron picks the release back up.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # upload release assets
  id-token: write        # OIDC for cosign keyless signing + attestation
  attestations: write    # write the build-provenance attestation

jobs:
  # Runs before the approval gate, so a malformed tag fails in seconds instead
  # of after someone approves it. The shape matters beyond tidiness: octoconda
  # decides what is a prerelease by substring (rc, alpha, beta, prerelease), not
  # by GitHub's prerelease flag, and treats everything before the first `-` as
  # the version. A tag like v0.15.0-pre.1 would be packaged as 0.15.0, take that
  # version's slot on the channel, and the real v0.15.0 would never be packaged.
  # Prereleases are therefore -rc.N, and nothing else is accepted.
  check-tag:
    name: Check tag format
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Tag is vX.Y.Z or vX.Y.Z-rc.N
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-rc.N; see the comment on this job"
            exit 1
          fi

  release:
    name: Release
    needs: check-tag
    runs-on: ubuntu-latest
    environment: release   # approval gate (see prerequisites)

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag being released to the one that triggered this run.
          # Without this, GoReleaser picks the highest version-sorted tag
          # pointing at HEAD, potentially choosing the wrong tag if multiple
          # ones point to the same commit, which can happen when cutting a
          # release candidate and then a release on top of it.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Publishing the Homebrew cask pushes to nebari-dev/homebrew-tap, a
          # different repo the default GITHUB_TOKEN cannot write to.
          # HOMEBREW_TAP_TOKEN is an org-level secret with write access to the tap.
          # The fallback keeps the variable defined so GoReleaser's config template
          # always resolves even if the secret is unavailable to this repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/*.tar.gz, dist/*.zip, dist/checksums.txt'

  # Installs the release just published with the installer users actually run,
  # main's scripts/install.sh, with a signature required. cosign there verifies
  # offline against the Sigstore trust root pinned in scripts/trusted-roots/, so
  # if Sigstore has rotated a key this release was signed under, every cosign
  # user's install now fails with a message that reads as tampering. This job is
  # where that shows up first: update the root as AGENTS.md describes. It also
  # catches any drift between the release assets and what the installer fetches.
  # Runs on main's checkout, not the tag's, because main is what `curl | sh`
  # serves; the release is already public by now, so a failure here is an alarm
  # rather than a gate.
  check-installer:
    name: Install the release with main's installer
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      # A cosign at the installer's floor, so the cosign path runs rather than
      # the gh fallback or the unverified one. This is the verifier, not the
      # signer pinned in the release job above.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Install ${{ github.ref_name }} with a signature required
        env:
          NIC_VERSION: ${{ github.ref_name }}
          NIC_REQUIRE_SIGNATURE: '1'
          INSTALL_DIR: ${{ runner.temp }}/nic-bin
        # The grep asserts that cosign is what verified it, so this keeps testing
        # the trust root even if the installer's choice of verifier changes.
        run: |
          set -euo pipefail
          sh scripts/install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
          if ! grep -q '^Authenticity verified (cosign' "$RUNNER_TEMP/install.log"; then
            echo "::error::the install did not verify the release with cosign; see the log above"
            exit 1
          fi
          "$INSTALL_DIR/nic" version

  # The hand-off. This costs one short run that usually finds the channel not
  # ready and exits; the cron in publish-starters.yml is what actually lands it.
  # Bundling the trigger here keeps the release the thing that starts the chain,
  # rather than leaving the starters to be noticed by a clock alone.
  dispatch-starters:
    name: Trigger starter publish
    needs: release
    # Same rc skip as the starter publish itself: prereleases never reach a
    # channel, so there is nothing for the starters to lock against.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # workflow_dispatch on publish-starters.yml
    steps:
      # Dispatched on main, not on the tag. A dispatched run executes the
      # workflow file from the ref it runs on, and quay-publish's deployment
      # policy is main-only: running on a tag would let anyone able to push a
      # v* tag carrying an edited publish-starters.yml reach the Quay token
      # with only the approval in the way. The publish job checks out the tag
      # explicitly, so nothing is lost.
      - name: Dispatch publish-starters for this tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run publish-starters.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG"
