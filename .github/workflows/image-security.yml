name: Container Image Security

# Scans every container image NIC deploys: builds the inventory with
# cmd/imagepin, then for each image generates an SBOM and scans it with Trivy
# (scripts/image-scan.sh, which runs the same way locally).
#
# Report-only: findings never fail this workflow. It fails only when an image
# can't be resolved, pulled or scanned. Results stay in this run: the job
# summary shows counts, and the artifact holds the inventory, SBOMs, per-image
# findings and findings.jsonl for later reporting and tracking work.
#
# Scheduled and manual runs on main sign the report (the attest job). Every
# other run, PRs included, shows in its summary what would have been signed.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'pkg/**'
      - 'cmd/imagepin/**'
      - 'scripts/image-scan.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/image-security.yml'

permissions:
  contents: read

env:
  # Identifies NIC's image scan report manifest (scripts/image-scan.sh writes
  # it). An identifier, not a page: verifiers pass it to select this attestation.
  REPORT_PREDICATE_TYPE: https://github.com/nebari-dev/nebari-infrastructure-core/attestations/image-scan-report/v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Scan deployed images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Unresolved images are recorded in the inventory and fail the scan step
      # below, so the remaining images still get scanned. If rendering itself
      # fails, no inventory is written and the scan step fails on that.
      - name: Build image inventory
        run: |
          mkdir -p dist/image-scan
          go run ./cmd/imagepin inventory -o dist/image-scan/inventory.json ||
            echo "::warning::imagepin reported unresolved images; the scan step will fail on them"

      - name: Cache Trivy databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # Pinned release, verified against the checksum Trivy publishes for it.
      - name: Install Trivy 0.76.1
        env:
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Generate SBOMs and scan
        run: bash scripts/image-scan.sh dist/image-scan/inventory.json dist/image-scan

      - name: Job summary
        if: always()
        run: |
          if [[ -f dist/image-scan/summary.md ]]; then
            cat dist/image-scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scan summary was produced; see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attestation dry run
        if: success() && !(github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
        run: |
          p=dist/image-scan/attestation/predicate.json
          {
            echo "### Attestation (dry run)"
            echo ""
            echo "Signing happens only on scheduled or manual runs on \`main\`. This run would sign:"
            echo ""
            echo "- **Subjects:** $(wc -l < dist/image-scan/attestation/subjects.txt) image digests (index and per-platform)"
            echo "- **Predicate type:** \`$REPORT_PREDICATE_TYPE\`"
            echo "- **Predicate:** \`sha256:$(sha256sum "$p" | cut -d' ' -f1)\`, covering $(jq '.images | length' "$p") image/platform reports"
            echo "- **Complete scan:** $(jq .complete "$p")"
            echo ""
            echo "Both files are in the \`attestation/\` folder of the artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-security-scan
          path: dist/image-scan/
          if-no-files-found: warn
          retention-days: 90

  # Signs the report from the scan job. Kept separate so only this job, which
  # runs no scanner or third-party image, can obtain a signing identity.
  attest:
    name: Attest scan report
    needs: scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # keyless signing identity (Sigstore)
      attestations: write # store the attestation with GitHub
    steps:
      - name: Download scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-security-scan
          path: dist/image-scan

      # Sign only a complete report, and only files that match the hashes the
      # report manifest records for them.
      - name: Check the report before signing
        run: |
          p=dist/image-scan/attestation/predicate.json
          jq -e '.complete == true' "$p" >/dev/null ||
            { echo "::error::scan was incomplete; not attesting"; exit 1; }
          jq -r '.reports | to_entries[] | "\(.value | sub("^sha256:"; ""))  dist/image-scan/\(.key)"' "$p" |
            sha256sum --check
          test -s dist/image-scan/attestation/subjects.txt

      # One attestation per run: every scanned image digest (index and
      # per-platform) is a subject, and the signed predicate is a manifest of
      # the report files' hashes and finding counts. NIC verifies it by digest
      # through GitHub's attestation API, e.g.
      #   gh attestation verify oci://<image>@<digest> \
      #     --repo nebari-dev/nebari-infrastructure-core --predicate-type <REPORT_PREDICATE_TYPE>
      #
      # Admission controllers (e.g. the Sigstore Policy Controller) need
      # attestations stored in the image's own registry. NIC deploys vendor
      # images from registries it can't write to, so that isn't possible today.
      # If self-hosting images ever becomes an option, explore per-digest
      # attestations pushed to that registry (actions/attest with
      # push-to-registry: true); the per-image SBOMs and findings this workflow
      # already produces would be the inputs.
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/image-scan/attestation/subjects.txt
          predicate-type: ${{ env.REPORT_PREDICATE_TYPE }}
          predicate-path: dist/image-scan/attestation/predicate.json
