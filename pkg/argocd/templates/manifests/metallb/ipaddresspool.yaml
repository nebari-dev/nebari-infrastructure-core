apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/managed-by: nebari-infrastructure-core
spec:
  addresses:
    - {{ .MetalLBAddressRange }}
  # Keep MetalLB's API-defaulted values explicit so the live object matches Git
  # and ArgoCD does not report persistent defaulting-only drift.
  autoAssign: true
  avoidBuggyIPs: false
