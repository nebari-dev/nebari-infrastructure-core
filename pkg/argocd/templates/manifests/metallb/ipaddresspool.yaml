apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/managed-by: nebari-infrastructure-core
spec:
  addresses:
    - {{ .MetalLBAddressRange }}
  # default-pool exists so LoadBalancer Services get an address without needing
  # a pool annotation. Automatic assignment is the whole point of it, so state it
  # rather than inherit whatever MetalLB defaults to.
  autoAssign: true
