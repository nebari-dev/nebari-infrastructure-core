# The operator's namespace. The Helm chart does not create it, and the
# kustomize install it replaced did, so declaring it here keeps it in the
# desired state of clusters upgraded from that install instead of letting
# ArgoCD prune it (and the operator with it). Prune=false guards the same
# thing if this file ever goes away.
#
# It is not in manifests/nebari-operator, the directory the kustomize install
# read: a regen deletes that directory, so an Application still on the old
# spec when it refreshes fails to compare instead of rendering only this
# namespace and pruning the operator.
apiVersion: v1
kind: Namespace
metadata:
  name: nebari-operator-system
  labels:
    app.kubernetes.io/name: nebari-operator
    app.kubernetes.io/managed-by: nebari-infrastructure-core
    control-plane: controller-manager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
