apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nebari-operator-system

resources:
  - https://github.com/nebari-dev/nebari-operator.git/config/default?ref=feature/lifecycle-api
images:
  - name: nebari-operator
    newName: quay.io/nebari/nebari-operator
    newTag: feature-lifecycle-api

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: nebari-operator-controller-manager
