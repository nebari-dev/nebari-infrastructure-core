apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .RootCASecretName }}
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/managed-by: nebari-infrastructure-core
spec:
  isCA: true
  commonName: "Nebari root CA ({{ .Domain }})"
  secretName: {{ .RootCASecretName }}
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
    # Rotating the root's key would invalidate every leaf it signed until reissued; cert-manager's default becomes Always from v1.18.
    rotationPolicy: Never
  nameConstraints:
    critical: true
    permitted:
      # svc covers the short Service name the API server dials for webhooks, svc.cluster.local the fully qualified one; NIC already assumes the cluster.local Service domain (KeycloakServiceURL). The platform domain is listed only on certificate.type=selfsigned (see RootCAPermittedDNSDomains).
      dnsDomains:
{{- range .RootCAPermittedDNSDomains }}
        - "{{ . }}"
{{- end }}
    # DNS constraints alone leave IP SANs unrestricted, so every IPv4 and IPv6 address is excluded. URI SANs stay unconstrained so a future mesh can issue SPIFFE identities from this root.
    excluded:
      ipRanges:
        - "0.0.0.0/0"
        - "::/0"
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
