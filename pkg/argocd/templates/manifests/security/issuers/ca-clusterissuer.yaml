apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  # Rendered on every certificate type under the same name; on selfsigned it is
  # also the gateway and operator issuer.
  name: {{ .CAIssuerName }}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/managed-by: nebari-infrastructure-core
spec:
  ca:
    secretName: {{ .RootCASecretName }}
