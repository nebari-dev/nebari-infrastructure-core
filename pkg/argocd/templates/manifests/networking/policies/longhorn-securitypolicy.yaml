apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/managed-by: nebari-infrastructure-core
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn
  oidc:
    # Split-horizon OIDC for the Longhorn admin UI. On private-domain /
    # air-gapped clusters, the Envoy Gateway control plane (which fetches
    # OIDC discovery) and the proxy pod (which resolves discovered endpoints)
    # can't reach Keycloak's public FQDN. We set the four provider fields
    # explicitly so EG never fetches discovery.
    #
    # This works regardless of whether Keycloak has
    # KC_HOSTNAME_BACKCHANNEL_DYNAMIC set. It relies on two Keycloak
    # invariants:
    #
    #   1. A static KC_HOSTNAME stamps the public URL as `iss` on every
    #      token, no matter which listener minted it — so the JWT block
    #      below can validate against the public issuer.
    #   2. Keycloak serves back-channel endpoints (token exchange, jwks) on
    #      any host address — so the token endpoint can be pinned in-cluster
    #      safely.
    #
    # Endpoint routing:
    #
    #   - issuer + tokenEndpoint: in-cluster URL. tokenEndpoint carries a
    #     Basic Auth secret over plaintext HTTP on Envoy's in-cluster
    #     network; NIC doesn't run TLS to Keycloak's admin port and the
    #     operator makes the same choice. issuer itself is inert on
    #     EG v1.6.2 (ir.OIDCProvider has no Issuer field once discovery is
    #     suppressed) but the CRD requires it; keeping it in-cluster mirrors
    #     the operator.
    #   - authorizationEndpoint + endSessionEndpoint: public URL. Browser
    #     redirects that must resolve on the user's machine.
    #
    # Requires Envoy Gateway v1.5+. Setting both authorizationEndpoint and
    # tokenEndpoint suppresses discovery entirely (envoyproxy/gateway
    # internal/gatewayapi/securitypolicy.go); with discovery suppressed, EG
    # also stops discovering end_session, so endSessionEndpoint must be set
    # explicitly or logout silently can't reach Keycloak.
    #
    # jwt.providers[].issuer below stays public because it must match the
    # `iss` claim Keycloak stamps into tokens.
    #
    # Design confirmation + reference implementation:
    # https://github.com/nebari-dev/nebari-operator/blob/main/internal/controller/reconcilers/auth/providers/keycloak.go#L73-L143
    provider:
      issuer: "{{ .KeycloakServiceURL }}/realms/{{ .KeycloakRealm }}"
      tokenEndpoint: "{{ .KeycloakServiceURL }}/realms/{{ .KeycloakRealm }}/protocol/openid-connect/token"
      authorizationEndpoint: "https://keycloak.{{ .Domain }}{{ .KeycloakBasePath }}/realms/{{ .KeycloakRealm }}/protocol/openid-connect/auth"
      endSessionEndpoint: "https://keycloak.{{ .Domain }}{{ .KeycloakBasePath }}/realms/{{ .KeycloakRealm }}/protocol/openid-connect/logout"
    clientID: longhorn
    clientSecret:
      name: {{ .LonghornOIDCSecretName }}
    redirectURL: "https://longhorn.{{ .Domain }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    scopes:
      - openid
      - profile
      - email
      - groups
    # Renew the session from the refresh token when the access token expires,
    # rather than bouncing the user back through Keycloak mid-session.
    refreshToken: true
    forwardAccessToken: true
  jwt:
    # A browser arrives with no token at all and MUST be allowed past JWT
    # authentication so the oidc filter above can redirect it to Keycloak.
    # Without this, Envoy Gateway's JWT authentication rejects every tokenless
    # request before the OIDC filter ever runs, and a human can never log in:
    # every browser gets a bare "Jwt is missing" 401.
    #
    # This relaxes AUTHENTICATION only, not authorization. The request still
    # fails closed, because spec.authorization.defaultAction is Deny and the one
    # allow rule requires a JWT claim, so a tokenless request that reaches the
    # authorization stage matches no rule and is denied. `optional: true` exists
    # only to let a tokenless request survive long enough to be redirected; it
    # grants it nothing.
    optional: true
    providers:
      - name: keycloak
        issuer: "https://keycloak.{{ .Domain }}{{ .KeycloakBasePath }}/realms/{{ .KeycloakRealm }}"
        remoteJWKS:
          uri: "{{ .KeycloakServiceURL }}/realms/{{ .KeycloakRealm }}/protocol/openid-connect/certs"
          # JWKS staleness window: how long Envoy Gateway keeps serving a cached
          # key set after Keycloak rotates the realm signing keys.
          cacheDuration: 300s
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-longhorn-admins
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              # The data-science-pack chart's RBAC bootstrap job
              # (files/keycloak_rbac_bootstrap.py) reconciles the realm-shared
              # groups mapper to full.path=true on every sync, so JWTs always
              # carry group names with a leading slash (e.g. "/longhorn-admins")
              # regardless of what we set in realm-setup-job. Match against the
              # path form rather than fighting that job.
              - name: groups
                valueType: StringArray
                values:
                  - /longhorn-admins
