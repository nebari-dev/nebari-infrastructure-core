apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/managed-by: nebari-infrastructure-core
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn
  oidc:
    # Split-horizon OIDC. Keycloak with `KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true`
    # exposes two faces for URLs but one identity for tokens: back-channel
    # endpoints (token, jwks) adapt to the request URL, front-channel endpoints
    # (authorization, end_session) stay pinned to the public hostname, and the
    # `iss` claim in tokens always points at the public hostname (KC_HOSTNAME).
    #
    # Envoy Gateway lives in the cluster and cannot always resolve the public
    # Keycloak FQDN (private-domain / air-gapped deployments). We set the four
    # OIDC provider fields explicitly rather than let EG fetch the well-known
    # discovery doc:
    #
    #   - issuer + tokenEndpoint use the in-cluster URL — server-side calls
    #     the gateway pod makes to exchange codes for tokens.
    #   - authorizationEndpoint + endSessionEndpoint use the public URL —
    #     browser redirects that must resolve on the user's machine.
    #
    # Setting both authorizationEndpoint and tokenEndpoint suppresses EG's
    # discovery fetch entirely (see envoyproxy/gateway api/v1alpha1/
    # oidc_types.go), so the gateway pod never has to resolve the public
    # hostname. With discovery suppressed, EG also stops discovering the
    # end-session endpoint, so we must set that explicitly too — otherwise
    # the logout flow silently can't reach Keycloak's end-session URL.
    #
    # `jwt.providers[].issuer` below stays on the public URL because it has to
    # match the `iss` claim in tokens, which Keycloak always stamps with
    # KC_HOSTNAME regardless of which endpoint minted the token.
    #
    # Design confirmation + reference implementation:
    # https://github.com/nebari-dev/nebari-operator/blob/main/internal/controller/reconcilers/auth/providers/keycloak.go#L73-L143
    provider:
      issuer: "{{ .KeycloakServiceURL }}/realms/nebari"
      tokenEndpoint: "{{ .KeycloakServiceURL }}/realms/nebari/protocol/openid-connect/token"
      authorizationEndpoint: "https://keycloak.{{ .Domain }}{{ .KeycloakBasePath }}/realms/nebari/protocol/openid-connect/auth"
      endSessionEndpoint: "https://keycloak.{{ .Domain }}{{ .KeycloakBasePath }}/realms/nebari/protocol/openid-connect/logout"
    clientID: longhorn
    clientSecret:
      name: {{ .LonghornOIDCSecretName }}
    redirectURL: "https://longhorn.{{ .Domain }}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    scopes:
      - openid
      - profile
      - email
      - groups
    # Renew the session from the refresh token when the access token expires,
    # rather than bouncing the user back through Keycloak mid-session.
    refreshToken: true
    forwardAccessToken: true
  jwt:
    providers:
      - name: keycloak
        issuer: "https://keycloak.{{ .Domain }}{{ .KeycloakBasePath }}/realms/nebari"
        remoteJWKS:
          uri: "{{ .KeycloakServiceURL }}/realms/nebari/protocol/openid-connect/certs"
          # JWKS staleness window: how long Envoy Gateway keeps serving a cached
          # key set after Keycloak rotates the realm signing keys.
          cacheDuration: 300s
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-longhorn-admins
        action: Allow
        principal:
          jwt:
            provider: keycloak
            claims:
              # The data-science-pack chart's RBAC bootstrap job
              # (files/keycloak_rbac_bootstrap.py) reconciles the realm-shared
              # groups mapper to full.path=true on every sync, so JWTs always
              # carry group names with a leading slash (e.g. "/longhorn-admins")
              # regardless of what we set in realm-setup-job. Match against the
              # path form rather than fighting that job.
              - name: groups
                valueType: StringArray
                values:
                  - /longhorn-admins
