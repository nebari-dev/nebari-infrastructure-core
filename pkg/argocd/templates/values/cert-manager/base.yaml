installCRDs: true
# The leader-election lease and its Role/RoleBinding default to
# kube-system, which the scoped foundational ArgoCD project does not
# allow (its destinations are derived from NIC's own templates and do
# not include kube-system). Keep leader election in the cert-manager
# namespace, which is an allowed destination and avoids granting
# cert-manager RBAC in kube-system.
global:
  leaderElection:
    namespace: cert-manager

image:
  repository: quay.io/jetstack/cert-manager-controller
  tag: "v1.17.2"
  digest: "sha256:2c314feeb5e8b1a250a93be96542f086abc9df2de8e1a0cd7bd491cc7cc7ac08"

config:
  enableGatewayAPI: true
# Serialize ACME HTTP-01 challenges to avoid a race when two Certificates
# share a SAN (e.g. nebari-gateway-cert and nebari-landing-nebari-system-cert
# both list <baseDomain>). Concurrent challenges for the same hostname
# collide on Let's Encrypt's authorization record and one fails with
# "No such authorization", leaving the cert stuck on failedIssuanceAttempts.
# See nebari-dev/nebari-infrastructure-core#267.
maxConcurrentChallenges: 1
prometheus:
  enabled: true
# Defaults from the #456 audit: controller and cainjector memory
# scales with cached Secrets; the webhook has no cache by design.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
webhook:
  image:
    repository: quay.io/jetstack/cert-manager-webhook
    tag: "v1.17.2"
    digest: "sha256:37b16a9dff004a755e5be11a4369aea4d5dd5895f98e1f7def886adca7f5c7b6"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
cainjector:
  image:
    repository: quay.io/jetstack/cert-manager-cainjector
    tag: "v1.17.2"
    digest: "sha256:ec56edb1161dbcdcb60b5408dd040c877b9f70161b71270c6439ad185796b5b7"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

acmesolver:
  image:
    repository: quay.io/jetstack/cert-manager-acmesolver
    tag: "v1.17.2"
    digest: "sha256:bba1a80cf367bd9fbf1b8c90c589eea88861c169841ecbc406cf15d5900d30ac"

startupapicheck:
  image:
    repository: quay.io/jetstack/cert-manager-startupapicheck
    tag: "v1.17.2"
    digest: "sha256:e18989b4f9126a94ee40856589eba247519d55225b68b49e82a06934c27c2910"