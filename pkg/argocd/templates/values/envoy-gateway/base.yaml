config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
deployment:
  envoyGateway:
    # Control plane only (xDS); the data-plane proxy pods are sized
    # by the EnvoyProxy CR in manifests/networking (#457).
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  replicas: 1
service:
  type: ClusterIP
  annotations: {}
