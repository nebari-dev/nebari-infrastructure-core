apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-foundational
    app.kubernetes.io/managed-by: nebari-infrastructure-core
  annotations:
    # Same wave as the crossplane chart: the ClusterRole is standalone (the
    # rbac-manager aggregates it whenever it appears), so it does not need to
    # wait for the chart, and landing it early means the first spin reconcile
    # already has the grant.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foundational

  source:
    repoURL: {{ .GitRepoURL }}
    targetRevision: {{ .GitBranch }}
    path: {{ if .GitPath }}{{ .GitPath }}/{{ end }}manifests/crossplane

  destination:
    server: https://kubernetes.default.svc
    # The ClusterRole is cluster-scoped, but the scoped foundational
    # AppProject validates the app-level namespace, so it must be an allowed
    # destination.
    namespace: crossplane-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
