apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-foundational
    app.kubernetes.io/managed-by: nebari-infrastructure-core
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foundational

  source:
    repoURL: {{ .GitRepoURL }}
    targetRevision: {{ .GitBranch }}
    path: {{ if .GitPath }}{{ .GitPath }}/{{ end }}manifests/networking

  destination:
    server: https://kubernetes.default.svc
    # GatewayClass is cluster-scoped and the Gateway/ReferenceGrant carry their
    # own metadata.namespace, but the scoped foundational AppProject validates
    # this app-level namespace, so it must be an allowed destination.
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Retry indefinitely, on the latest revision so a fix from the next deploy
    # is picked up. See https://github.com/nebari-dev/nebari-infrastructure-core/issues/450
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
