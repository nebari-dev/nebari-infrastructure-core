project_name: my-nebari-existing
domain: nebari.example.com

# Optional: shared gateway tuning. request_buffer_limit is the largest request
# the gateway buffers per client connection; larger requests get HTTP 413.
# LLM traffic through Envoy AI Gateway is buffered whole, so coding assistants
# need far more than Envoy's 32Ki default. Default: 10Mi. Each connection can
# grow to the limit, so raise it only as far as your largest requests need.
# gateway:
#   request_buffer_limit: 20Mi

cluster:
  existing:
    # kubeconfig is the path to the kubeconfig file. May be absolute or relative and
    # tilde (~) is not expanded. If not specified, defaults to the KUBECONFIG environment
    # variable or $HOME/.kube/config.
    kubeconfig: path/to/kubeconfig
    context: "arn:aws:eks:us-west-2:123456789012:cluster/my-nebari"
    storage_class: gp2

certificate:
  type: selfsigned

# GitOps repository configuration (required)
# Configures the repository that ArgoCD will use to manage cluster resources
repository:
  existing:
    url: "https://github.com/my-org/my-gitops-repo.git"  # with ssh, use git@github.com:my-org/my-gitops-repo.git
    branch: main
    path: "clusters/my-nebari-existing" # Optional subdirectory within the repository
    auth:
      token:
        env: GIT_TOKEN  # environment variable containing a Git access token
      # OR use an SSH key (required for Bitbucket, and use the git@ URL above):
      # ssh:
      #   env: GIT_SSH_PRIVATE_KEY
