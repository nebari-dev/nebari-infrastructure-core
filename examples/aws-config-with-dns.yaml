project_name: my-nebari-aws
domain: nebari.example.com

# TLS certificate configuration
certificate:
  type: letsencrypt
  acme:
    email: admin@example.com

# GitOps repository configuration (required for foundational services)
# ArgoCD uses this repository to deploy Envoy Gateway, cert-manager, Keycloak, etc.
repository:
  existing:
    url: "https://github.com/my-org/my-gitops-repo.git"  # with ssh, use git@github.com:my-org/my-gitops-repo.git
    branch: main
    path: "clusters/my-nebari-aws"
    auth:
      token:
        env: GIT_TOKEN  # environment variable containing a Git access token
      # OR use an SSH key (required for Bitbucket, and use the git@ URL above):
      # ssh:
      #   env: GIT_SSH_PRIVATE_KEY

# Optional: shared gateway tuning. request_buffer_limit is the largest request
# the gateway buffers per client connection; larger requests get HTTP 413.
# LLM traffic through Envoy AI Gateway is buffered whole, so coding assistants
# need far more than Envoy's 32Ki default. Default: 10Mi. Each connection can
# grow to the limit, so raise it only as far as your largest requests need.
# gateway:
#   request_buffer_limit: 20Mi

cluster:
  aws:
    region: us-west-2
    kubernetes_version: "1.34"
    availability_zones:
      - us-west-2a
      - us-west-2b
    vpc_cidr_block: "10.10.0.0/16"
    endpoint_private_access: true
    endpoint_public_access: true

    node_groups:
      general:
        instance: m5.2xlarge
        min_nodes: 1
        max_nodes: 1

      user:
        instance: m5.xlarge
        min_nodes: 0
        max_nodes: 5

      worker:
        instance: m5.xlarge
        min_nodes: 0
        max_nodes: 5

    tags:
      Environment: development
      Project: nebari

# DNS configuration (optional)
# Secrets like API tokens are read from environment variables (see .env.example)
dns:
  cloudflare:
    zone_name: example.com # Your Cloudflare zone/domain
